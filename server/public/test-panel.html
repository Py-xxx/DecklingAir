<!DOCTYPE html>
<!--
  TEST PANEL — temporary, self-contained. Delete this file + the matching
  "TEST PANEL" block in server/spotify.js to remove it completely.
  Raw Spotify only: search → click to play, and a full-queue reader.
  Open at: http://<pi-ip>:3002/test-panel.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify Test Panel</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: #0a0a0a; color: #eee;
    font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 12px; margin-bottom: 18px; }
  .cols { display: flex; gap: 20px; flex-wrap: wrap; }
  .col { flex: 1 1 340px; min-width: 300px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #1DB954; margin: 0 0 10px; }
  .bar { display: flex; gap: 8px; margin-bottom: 12px; }
  input {
    flex: 1; background: #161616; border: 1px solid rgba(255,255,255,.14);
    border-radius: 8px; color: #fff; padding: 9px 12px; font-size: 14px; outline: none;
  }
  input:focus { border-color: #1DB954; }
  button {
    background: #1DB954; border: none; border-radius: 8px; color: #07210f;
    font-weight: 700; padding: 9px 14px; cursor: pointer; font-size: 13px;
  }
  button.sec { background: #222; color: #ddd; border: 1px solid rgba(255,255,255,.14); }
  button:active { filter: brightness(.9); }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    background: #161616; border: 1px solid rgba(255,255,255,.07);
    border-radius: 8px; padding: 8px 10px;
  }
  .row.play { cursor: pointer; }
  .row.play:hover { background: #1f1f1f; border-color: rgba(29,185,84,.5); }
  .art { width: 38px; height: 38px; border-radius: 4px; object-fit: cover; background: #222; flex-shrink: 0; }
  .meta { min-width: 0; flex: 1; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { color: #999; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .idx { color: #666; font-size: 12px; width: 22px; text-align: right; flex-shrink: 0; }
  .now { border-color: #1DB954; }
  .now .idx { color: #1DB954; }
  .empty { color: #666; font-size: 13px; padding: 8px 2px; }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #1DB954; color: #07210f; font-weight: 700; padding: 8px 16px;
    border-radius: 20px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: #c0392b; color: #fff; }
</style>
</head>
<body>
  <h1>Spotify Test Panel</h1>
  <div class="sub">Raw API only — click a search result to play it instantly; read the live queue. No smart-queue logic.</div>

  <div class="cols">
    <div class="col">
      <h2>Search → click to play</h2>
      <div class="bar">
        <input id="q" type="text" placeholder="Search songs…" autocomplete="off">
        <button id="go">Search</button>
      </div>
      <div id="results" class="list"><div class="empty">Type a query and hit Search.</div></div>
    </div>

    <div class="col">
      <h2>Queue (raw /me/player/queue)</h2>
      <div class="bar">
        <button id="refresh" class="sec">Refresh queue</button>
      </div>
      <div id="queue" class="list"><div class="empty">Hit “Refresh queue”.</div></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/vendor/socket.io.js"></script>
  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

    let toastTimer = null;
    function toast(msg, isErr) {
      const t = $('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isErr ? ' err' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = 'toast'; }, 1800);
    }

    // ---- Search ----
    function doSearch() {
      const q = $('q').value.trim();
      if (!q) return;
      $('results').innerHTML = '<div class="empty">Searching…</div>';
      socket.emit('test:search', { q });
    }
    $('go').addEventListener('click', doSearch);
    $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

    socket.on('test:search_results', ({ items }) => {
      const el = $('results');
      if (!items || !items.length) { el.innerHTML = '<div class="empty">No results.</div>'; return; }
      el.innerHTML = '';
      for (const t of items) {
        const row = document.createElement('div');
        row.className = 'row play';
        row.innerHTML =
          (t.art ? `<img class="art" src="${esc(t.art)}" alt="">` : '<div class="art"></div>') +
          `<div class="meta"><div class="name">${esc(t.name)}</div><div class="artist">${esc(t.artist)}</div></div>`;
        row.addEventListener('click', () => {
          socket.emit('test:play', { uri: t.uri });
          toast('▶ ' + t.name);
        });
        el.appendChild(row);
      }
    });

    socket.on('test:played', () => {/* fire-and-forget */});

    // ---- Queue ----
    function refreshQueue() {
      $('queue').innerHTML = '<div class="empty">Loading queue…</div>';
      socket.emit('test:get_queue');
    }
    $('refresh').addEventListener('click', refreshQueue);

    socket.on('test:queue', ({ current, queue }) => {
      const el = $('queue');
      el.innerHTML = '';
      const add = (t, label, cls) => {
        const row = document.createElement('div');
        row.className = 'row' + (cls ? ' ' + cls : '');
        row.innerHTML =
          `<div class="idx">${label}</div>` +
          `<div class="meta"><div class="name">${esc(t ? t.name : '—')}</div><div class="artist">${esc(t ? t.artist : '')}</div></div>`;
        el.appendChild(row);
      };
      if (current) add(current, '▶', 'now');
      if (!queue || !queue.length) {
        if (!current) el.innerHTML = '<div class="empty">Queue is empty (or nothing playing).</div>';
        return;
      }
      queue.forEach((t, i) => add(t, String(i + 1)));
    });

    socket.on('test:error', ({ message }) => toast('Error: ' + message, true));
  </script>
</body>
</html>
